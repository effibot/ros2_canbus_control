##############################################################################
# ROS2 Motor Driver Node Parameters
#
# Author: effibot (andrea.efficace1@gmail.com)
# Date: 2025-11-10
#
# Description:
#   Configuration for all 4 motors (2 traction + 2 steering) on single CAN bus
#   - Traction motors: Same mechanical parameters (counts, gear ratio, torque)
#   - Steering motors: Same mechanical parameters (different from traction)
##############################################################################

motor_driver:
  ros__parameters:
    # ========================================================================
    # CAN Interface Configuration
    # ========================================================================

    can_interface: "vcan0" # SocketCAN interface name
    can_bitrate: 500000 # 500 kbps (informational, set via ip link)

    # ========================================================================
    # Motor Configurations
    # ========================================================================

    motors:
      # ----------------------------------------------------------------------
      # TRACTION MOTORS (Identical mechanical parameters)
      # ----------------------------------------------------------------------

      motor_1:
        node_id: 1
        name: "traction_motor_left"
        type: "traction"
        description: "Left traction motor for differential drive"

        # CANopen configuration
        config_file: "/home/ros/ws/install/share/ros2_waveshare/config/motor_config.json"

        # Mechanical parameters (for unit conversion)
        counts_per_revolution: 10000.0 # Encoder resolution [counts/rev]
        gear_ratio: 50.0 # Gearbox reduction ratio [motor_rev/output_rev]
        torque_constant_nm_per_a: 0.05 # Motor torque constant [N·m/A]

        # Control parameters
        max_velocity_rad_s: 10.0 # Maximum velocity limit [rad/s]
        max_torque_nm: 5.0 # Maximum torque limit [N·m]
        max_current_ma: 10000 # Maximum current limit [mA]

        # Publishing rates (per motor)
        feedback_rate_hz: 100.0 # MotorFeedback publishing rate
        status_rate_hz: 10.0 # MotorStatus publishing rate

      motor_2:
        node_id: 2
        name: "traction_motor_right"
        type: "traction"
        description: "Right traction motor for differential drive"

        # CANopen configuration
        config_file: "config/motor_config.json"

        # Mechanical parameters (SAME AS motor_1)
        counts_per_revolution: 10000.0
        gear_ratio: 50.0
        torque_constant_nm_per_a: 0.05

        # Control parameters (SAME AS motor_1)
        max_velocity_rad_s: 10.0
        max_torque_nm: 5.0
        max_current_ma: 10000

        # Publishing rates
        feedback_rate_hz: 100.0
        status_rate_hz: 10.0

      # ----------------------------------------------------------------------
      # STEERING MOTORS (Identical mechanical parameters)
      # ----------------------------------------------------------------------

      motor_3:
        node_id: 3
        name: "steering_motor_left"
        type: "steering"
        description: "Left steering motor for front-wheel steering"

        # CANopen configuration
        config_file: "config/motor_config.json"

        # Mechanical parameters (different from traction)
        counts_per_revolution: 10000.0 # Encoder resolution [counts/rev]
        gear_ratio: 100.0 # Higher gear ratio for steering precision
        torque_constant_nm_per_a: 0.03 # Different motor type

        # Control parameters
        max_velocity_rad_s: 5.0 # Lower max velocity for steering
        max_torque_nm: 3.0 # Lower torque for steering
        max_current_ma: 6000 # Lower current limit

        # Publishing rates
        feedback_rate_hz: 100.0
        status_rate_hz: 10.0

      motor_4:
        node_id: 4
        name: "steering_motor_right"
        type: "steering"
        description: "Right steering motor for front-wheel steering"

        # CANopen configuration
        config_file: "config/motor_config.json"

        # Mechanical parameters (SAME AS motor_3)
        counts_per_revolution: 10000.0
        gear_ratio: 100.0
        torque_constant_nm_per_a: 0.03

        # Control parameters (SAME AS motor_3)
        max_velocity_rad_s: 5.0
        max_torque_nm: 3.0
        max_current_ma: 6000

        # Publishing rates
        feedback_rate_hz: 100.0
        status_rate_hz: 10.0

    # ========================================================================
    # PDO Configuration (Shared across all motors)
    # ========================================================================

    pdo:
      sync_rate_hz: 100.0 # SYNC message frequency [Hz]
      sync_enabled: true # Enable SYNC transmission

      tpdo_timeout_ms: 100 # TPDO receive timeout [ms]
      rpdo_retry_count: 3 # RPDO send retry attempts

      # TPDO mapping (must match motor_config.json)
      tpdo1_cobid_offset: 0x180 # TPDO1 COB-ID = 0x180 + node_id
      tpdo2_cobid_offset: 0x280 # TPDO2 COB-ID = 0x280 + node_id

      # RPDO mapping
      rpdo1_cobid_offset: 0x200 # RPDO1 COB-ID = 0x200 + node_id
      rpdo2_cobid_offset: 0x300 # RPDO2 COB-ID = 0x300 + node_id

    # ========================================================================
    # Publishing Rates (Combined messages)
    # ========================================================================

    publishing:
      joint_state_rate_hz: 100.0 # sensor_msgs/JointState (all motors)
      pdo_statistics_rate_hz: 1.0 # PDOStatistics message
      diagnostics_rate_hz: 1.0 # diagnostic_msgs/DiagnosticArray

    # ========================================================================
    # Timeout Configuration
    # ========================================================================

    timeouts:
      sdo_timeout_ms: 1000 # SDO request timeout
      state_transition_timeout_ms: 1000 # CIA402 state transition timeout
      action_default_timeout_sec: 5.0 # Default action timeout

      # Motor initialization timeouts
      motor_init_timeout_sec: 10.0 # Per-motor init timeout
      total_startup_timeout_sec: 30.0 # Total node startup timeout

    # ========================================================================
    # Diagnostics Configuration
    # ========================================================================

    diagnostics:
      enable_extended_diagnostics: true # Include PDO statistics

      # Warning thresholds
      temperature_warning_c: 60.0 # Temperature warning level [°C]
      temperature_error_c: 80.0 # Temperature error level [°C]

      voltage_min_warning_v: 22.0 # Low voltage warning [V]
      voltage_max_warning_v: 28.0 # High voltage warning [V]

      current_warning_percent: 80.0 # Current warning (% of max)

      # PDO statistics thresholds
      tpdo_missed_warning_count: 10 # Missed TPDO warning threshold
      tpdo_latency_warning_ms: 20.0 # TPDO latency warning [ms]

    # ========================================================================
    # Safety Configuration
    # ========================================================================

    safety:
      enable_watchdog: true # Enable command watchdog
      watchdog_timeout_ms: 500 # Stop motor if no command for this long

      auto_disable_on_fault: true # Disable motor on fault detection
      auto_recover_faults: false # Don't auto-recover (require manual reset)

      emergency_stop_deceleration_rad_s2: 50.0 # Emergency deceleration [rad/s²]

    # ========================================================================
    # Logging Configuration
    # ========================================================================

    logging:
      log_sdo_transactions: false # Log all SDO read/write operations
      log_pdo_statistics: true # Log PDO statistics periodically
      log_state_transitions: true # Log CIA402 state changes

      verbose_startup: true # Detailed logging during initialization
