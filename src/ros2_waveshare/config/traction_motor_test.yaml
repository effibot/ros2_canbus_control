##############################################################################
# Traction Motor Test Configuration
#
# Author: effibot (andrea.efficace1@gmail.com)
# Date: 2025-11-10
#
# Description:
#   Test configuration for single traction motor
#   Use for development/testing of left traction motor only
##############################################################################

motor_driver:
  ros__parameters:
    can_interface: "vcan0"

    motors:
      motor_1:
        node_id: 1
        name: "traction_motor_left"
        type: "traction"

        config_file: "/home/ros/ws/install/share/ros2_waveshare/config/motor_config.json"

        # Traction motor mechanical parameters
        counts_per_revolution: 10000.0
        gear_ratio: 50.0
        torque_constant_nm_per_a: 0.05

        max_velocity_rad_s: 10.0
        max_torque_nm: 5.0
        max_current_ma: 10000

        feedback_rate_hz: 100.0
        status_rate_hz: 10.0

    pdo:
      sync_rate_hz: 100.0
      sync_enabled: true
      tpdo_timeout_ms: 100
      rpdo_retry_count: 3

    publishing:
      joint_state_rate_hz: 100.0
      pdo_statistics_rate_hz: 1.0
      diagnostics_rate_hz: 1.0

    timeouts:
      sdo_timeout_ms: 1000
      state_transition_timeout_ms: 1000
      action_default_timeout_sec: 5.0

    diagnostics:
      enable_extended_diagnostics: true
      temperature_warning_c: 60.0
      temperature_error_c: 80.0
      voltage_min_warning_v: 22.0
      voltage_max_warning_v: 28.0
      current_warning_percent: 80.0

    safety:
      enable_watchdog: true
      watchdog_timeout_ms: 500
      auto_disable_on_fault: true
      auto_recover_faults: false

    logging:
      log_sdo_transactions: true
      log_pdo_statistics: true
      log_state_transitions: true
      verbose_startup: true
