/**:
  ros__parameters:
    # SocketCAN interface name
    socketcan_interface: "vcan0"
    
    # USB device path
    usb_device: "/dev/ttyUSB0"
    
    # Serial baud rate (2Mbps recommended)
    serial_baud: 2000000
    
    # CAN bus baud rate (match your motor driver - likely 1Mbps)
    can_baud: 1000000
    
    # CAN mode: "NORMAL", "LOOPBACK", "LISTENONLY", "LOOPBACK_LISTENONLY"
    can_mode: "NORMAL"
    
    # Auto retransmit on error
    auto_retransmit: true
    
    # Timeout for reading from USB adapter (ms)
    usb_read_timeout_ms: 1000
    
    # Timeout for reading from SocketCAN (ms)
    socketcan_read_timeout_ms: 1000
    
    # Diagnostics publishing rate (Hz)
    diagnostics_rate: 1.0