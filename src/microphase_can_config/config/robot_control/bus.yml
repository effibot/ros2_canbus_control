options:
  # trunk-ignore(yamllint/syntax)
  dcf_path: @BUS_CONFIG_PATH@

master:
  node_id: 1
  driver: ros2_canopen::MasterDriver
  package: canopen_master_driver
  sync_period: 10000

defaults:
  dcf: TRACTION_PWR.eds
  driver: ros2_canopen::Cia402Driver
  package: canopen_402_driver
  period: 10
  position_mode: 1
  revision_number: 1

  # SDO Configuration - Initialize critical parameters
  sdo:
    # Interpolation time period configuration
    - { index: 0x60C2, sub_index: 1, value: 2 } # Time units (2 = milliseconds)
    - { index: 0x60C2, sub_index: 2, value: -3 } # Time index (-3 exponent)

    # Motion profile parameters (safe defaults)
    - { index: 0x6081, sub_index: 0, value: 10000 } # Profile velocity (10000 units)
    - { index: 0x6083, sub_index: 0, value: 5000 } # Profile acceleration (5000 units)
    - { index: 0x6084, sub_index: 0, value: 5000 } # Profile deceleration (5000 units)
    - { index: 0x6085, sub_index: 0, value: 10000 } # Quick stop deceleration (10000 units)

    # Position limits (full range by default)
    - { index: 0x607D, sub_index: 1, value: -2147483648 } # Min position limit
    - { index: 0x607D, sub_index: 2, value: 2147483647 } # Max position limit

    # Max velocity and acceleration limits
    - { index: 0x607F, sub_index: 0, value: 50000 } # Max profile velocity
    - { index: 0x60C5, sub_index: 0, value: 20000 } # Max acceleration
    - { index: 0x60C6, sub_index: 0, value: 20000 } # Max deceleration

    # Current limit
    - { index: 0x6073, sub_index: 0, value: 1000 } # Max Current (default from EDS)

    # Following error configuration
    - { index: 0x6065, sub_index: 0, value: 5000 } # Following error window
    - { index: 0x6066, sub_index: 0, value: 1000 } # Following error time-out (ms)

    # Position window configuration
    - { index: 0x6067, sub_index: 0, value: 100 } # Position window (target reached)
    - { index: 0x6068, sub_index: 0, value: 500 } # Position time-out (ms)

    # Gear ratio (feed constant)
    - { index: 0x6092, sub_index: 1, value: 65536 } # Feed constant numerator
    - { index: 0x6092, sub_index: 2, value: 1 } # Shaft revolutions denominator

    # Homing configuration
    - { index: 0x6098, sub_index: 0, value: 35 } # Homing method
    - { index: 0x6099, sub_index: 1, value: 1000 } # Speed during search for switch
    - { index: 0x6099, sub_index: 2, value: 500 } # Speed during search for zero
    - { index: 0x609A, sub_index: 0, value: 2000 } # Homing acceleration

  # RPDO Configuration - Receive PDOs (Controller -> Device)
  # RPDO1: Control and command parameters
  rpdo:
    1:
      cob_id: auto
      transmission: 0x01 # Synchronous
      enabled: true
      mapping:
        - { index: 0x6040, sub_index: 0 } # Control word (uint16_t, 2 bytes)
        - { index: 0x607A, sub_index: 0 } # Target position (int32_t, 4 bytes)
        - { index: 0x6081, sub_index: 0 } # Profile velocity (uint32_t, 4 bytes) - Total: 10 bytes

    # RPDO2: Velocity and mode control
    2:
      cob_id: auto
      transmission: 0x01
      enabled: true
      mapping:
        - { index: 0x6060, sub_index: 0 } # Mode of operation (int8_t, 1 byte)
        - { index: 0x60FF, sub_index: 0 } # Target velocity (int32_t, 4 bytes)
        - { index: 0x6083, sub_index: 0 } # Profile acceleration (uint32_t, 4 bytes) - Total: 9 bytes

    # RPDO3: Motion profile parameters
    3:
      cob_id: auto
      transmission: 0xFF # Asynchronous
      enabled: true
      mapping:
        - { index: 0x6084, sub_index: 0 } # Profile deceleration (uint32_t, 4 bytes)
        - { index: 0x6085, sub_index: 0 } # Quick stop deceleration (uint32_t, 4 bytes) - Total: 8 bytes

    # RPDO4: Digital outputs and interpolation
    4:
      cob_id: auto
      transmission: 0xFF
      enabled: true
      mapping:
        - { index: 0x60FE, sub_index: 1 } # Physical digital outputs (uint32_t, 4 bytes)
        - { index: 0x60FE, sub_index: 2 } # Digital output bit mask (uint32_t, 4 bytes) - Total: 8 bytes

  # TPDO Configuration - Transmit PDOs (Device -> Controller)
  # TPDO1: Status and position feedback
  tpdo:
    1:
      cob_id: auto
      transmission: 0x01 # Synchronous
      enabled: true
      mapping:
        - { index: 0x6041, sub_index: 0 } # Status word (uint16_t, 2 bytes)
        - { index: 0x6064, sub_index: 0 } # Position actual value (int32_t, 4 bytes)
        - { index: 0x606C, sub_index: 0 } # Velocity actual value (int32_t, 4 bytes) - Total: 10 bytes

    # TPDO2: Operation mode and error status
    2:
      cob_id: auto
      transmission: 0x01
      enabled: true
      mapping:
        - { index: 0x6061, sub_index: 0 } # Mode of operation display (int8_t, 1 byte)
        - { index: 0x1001, sub_index: 0 } # Error register (uint8_t, 1 byte)
        - { index: 0x60F4, sub_index: 0 } # Following error actual value (int32_t, 4 bytes)
        - { index: 0x6073, sub_index: 0 } # Max Current (uint16_t, 2 bytes) - Total: 8 bytes

    # TPDO3: Digital I/O status
    3:
      cob_id: auto
      transmission: 0xFF # Asynchronous (event-driven)
      enabled: true
      mapping:
        - { index: 0x60FD, sub_index: 0 } # Digital inputs (uint32_t, 4 bytes)
        - { index: 0x1002, sub_index: 0 } # Manufacturer Status Register (uint32_t, 4 bytes) - Total: 8 bytes

    # TPDO4: Cam and extended status
    4:
      cob_id: auto
      transmission: 0xFF
      enabled: false # Disabled by default, enable if cam functionality needed
      mapping:
        - { index: 0x6300, sub_index: 1 } # Cam state register Ch1 (uint8_t, 1 byte)
        - { index: 0x607E, sub_index: 0 } # Polarity (uint8_t, 1 byte) - Total: 2 bytes

nodes:
  joint_1:
    node_id: 2
  joint_2:
    node_id: 3
